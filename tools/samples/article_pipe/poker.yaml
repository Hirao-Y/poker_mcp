# このファイルは gen_input.py が CAD モデルから生成したものです。
# 正本は CAD モデルです。形状を変えたら再生成してください。

thinnedindices:
  sourcepoint: 10
  pseudosourcepoint: 10
  detectorgrid: 10
  detectorevaluation: 10
  pathtrace: 5
  buildupenergy: 3
  buildupmfp: 3

unit:
  length: cm
  angle: degree
  density: g/cm3
  radioactivity: Bq

# [ダミー] 以下の body / zone は --path-input では幾何として使われません。
# 幾何は .paths から読み込まれます。ここに置くのは、POKER の入力規約上
# ゾーンに実在する立体が必要なことと、材質の密度をここから引くためです。
# 立体どうしが重ならないよう x 方向に並べてあります。
body:
  - name: REF_Concrete
    type: RPP
    min: 0 -1 -1
    max: 1 1 1
  - name: REF_SUS_A
    type: RPP
    min: 10 -1 -1
    max: 11 1 1
  - name: REF_Water
    type: RPP
    min: 20 -1 -1
    max: 21 1 1

zone:
  - body_name: ATMOSPHERE
    material: VOID
  - body_name: REF_Concrete
    material: Concrete
    density: 2.1
  - body_name: REF_SUS_A
    material: SUS_A
    density: 7.8
  - body_name: REF_Water
    material: Water
    density: 1

transform: []

# 並び順で選択されるビルドアップ材料が変わります。
buildup_factor:
  - material: Concrete
    use_slant_correction: false
    use_finite_medium_correction: false
  - material: Iron
    # SUS_A の等価材料として指定
    use_slant_correction: false
    use_finite_medium_correction: false
  - material: Water
    use_slant_correction: false
    use_finite_medium_correction: false

